name: Bug report
description: Text comes out in the wrong order, loses its colors, or breaks alignment.
labels: [bug]
body:
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The exact text you passed in. If it has colors, paste it as a JSON string (for example from `JSON.stringify(text)`).
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What you saw
      description: A screenshot helps most.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: detect
    attributes:
      label: Output of `termbidi --detect`
      render: json
  - type: input
    id: env
    attributes:
      label: Terminal, OS, font and termbidi version
      placeholder: Windows Terminal 1.23, Windows 11, Cascadia Mono, termbidi 0.1.0
    validations:
      required: true
