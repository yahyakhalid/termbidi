<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>termbidi banner (Arabic)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #13233b;
    --ink-2: #1c3150;
    --paper: #f2ead8;
    --rule: #3a5275;
    --wrong: #ff8f5c;
    --right: #6fd6c3;
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 640px; background: var(--ink); color: var(--paper); font-family: 'IBM Plex Sans Arabic', sans-serif; overflow: hidden; }
  .frame { position: absolute; inset: 0; padding: 52px 64px 56px; display: grid; align-content: center; gap: 44px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .ar { font: 700 40px/1.35 'IBM Plex Sans Arabic', sans-serif; }
  .en { font: 400 21px/1.4 'IBM Plex Sans', sans-serif; color: #b9c3d3; direction: ltr; text-align: right; margin-top: 8px; }
  .name { font: 600 76px/0.9 'IBM Plex Mono', monospace; letter-spacing: -2px; direction: ltr; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
  .panel { background: #010409; border-radius: 14px; overflow: hidden; border: 1px solid var(--rule); }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 18px; background: var(--ink-2); }
  .bar .tag { font: 700 20px 'IBM Plex Sans Arabic', sans-serif; }
  .before .tag { color: var(--wrong); }
  .after .tag { color: var(--right); }
  .bar .cmd { color: #9fb0c8; font: 500 16px 'IBM Plex Mono', monospace; direction: ltr; }
  .shot { display: block; width: 100%; height: auto; padding: 10px 6px 12px; }
</style>
</head>
<body>
<div class="frame">
  <header>
    <div>
      <p class="ar">العربية تُقرأ صحيحة في الطرفية،<br>بألوانها وأعمدتها</p>
      <p class="en">Readable Arabic, Hebrew, Persian and Urdu in any terminal</p>
    </div>
    <div class="name">termbidi</div>
  </header>
  <div class="cmp">
    <div class="panel before"><div class="bar"><span class="tag">قبل</span><span class="cmd">VS Code terminal</span></div><img class="shot" src="before.png" alt=""></div>
    <div class="panel after"><div class="bar"><span class="tag">بعد</span><span class="cmd">… | termbidi</span></div><img class="shot" src="after.png" alt=""></div>
  </div>
</div>
</body>
</html>
