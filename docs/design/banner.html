<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>termbidi banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #13233b;      /* deep ink blue */
    --ink-2: #1c3150;
    --paper: #f2ead8;    /* sand, the color of a printed page */
    --rule: #3a5275;
    --wrong: #ff8f5c;    /* marks the broken side */
    --right: #6fd6c3;    /* marks the fixed side */
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 640px; background: var(--ink); color: var(--paper); font-family: 'IBM Plex Sans', sans-serif; overflow: hidden; }
  .frame { position: absolute; inset: 0; padding: 52px 64px 56px; display: grid; grid-template-rows: auto auto; align-content: center; gap: 44px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .name { font: 600 76px/0.9 'IBM Plex Mono', monospace; letter-spacing: -2px; }
  .lines { text-align: right; }
  .en { font: 400 24px/1.4 'IBM Plex Sans', sans-serif; max-width: 700px; color: #d9d0bc; }
  .ar { font: 600 30px/1.5 'IBM Plex Sans Arabic', sans-serif; direction: rtl; margin-top: 6px; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
  .panel { background: #010409; border-radius: 14px; overflow: hidden; border: 1px solid var(--rule); display: flex; flex-direction: column; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; font: 500 18px 'IBM Plex Mono', monospace; background: var(--ink-2); }
  .bar .tag { font-weight: 600; }
  .before .tag { color: var(--wrong); }
  .after .tag { color: var(--right); }
  .bar .cmd { color: #9fb0c8; font-size: 16px; }
  .shot { display: block; width: 100%; height: auto; padding: 10px 6px 12px; }
</style>
</head>
<body>
<div class="frame">
  <header>
    <div class="name">termbidi</div>
    <div class="lines">
      <p class="en">Arabic, Hebrew, Persian and Urdu that read right in terminals with no RTL support, with colors and columns kept.</p>
      <p class="ar">العربية تُقرأ صحيحة في الطرفية، بألوانها وأعمدتها</p>
    </div>
  </header>
  <div class="cmp">
    <div class="panel before"><div class="bar"><span class="tag">before</span><span class="cmd">VS Code terminal (xterm.js)</span></div><img class="shot" src="before.png" alt=""></div>
    <div class="panel after"><div class="bar"><span class="tag">after</span><span class="cmd">… | termbidi</span></div><img class="shot" src="after.png" alt=""></div>
  </div>
</div>
</body>
</html>
